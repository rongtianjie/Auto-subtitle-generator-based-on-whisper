---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: subweaver
data:
  APP_NAME: "Whisper 自动字幕生成平台"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"
  DEBUG: "false"
  PROMETHEUS_ENABLED: "true"
  WORKER_POLL_INTERVAL: "5"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: subweaver
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: []
    rule_files:
      - '/etc/prometheus/rules.yml'
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'backend'
        static_configs:
          - targets: ['backend:8000']
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
  rules.yml: |
    groups:
      - name: application
        rules:
          - alert: HighErrorRate
            expr: rate(http_requests_total{status_code=~"5.."}[5m]) > 0.05
            for: 5m
            annotations:
              summary: "高错误率告警"
              description: "{{ $labels.endpoint }} 错误率 > 5%"
          - alert: HighLatency
            expr: histogram_quantile(0.95, http_request_duration_seconds) > 1
            for: 5m
            annotations:
              summary: "高延迟告警"
              description: "p95 延迟 > 1s"
          - alert: DatabaseDown
            expr: up{job="postgres"} == 0
            for: 1m
            annotations:
              summary: "数据库连接失败"
          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes > 1800000000
            for: 5m
            annotations:
              summary: "内存使用过高"
              description: "内存使用 > 1.8GB"
